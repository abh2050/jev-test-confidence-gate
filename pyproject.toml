[project]
name = "agentbench"
version = "0.1.0"
description = "LangGraph multi-agent triage benchmarked across TypeSafe Jev and OpenAI decision engines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typesafe-sdk>=0.7.0",
    "langgraph>=0.2.0",
    "openai>=1.60.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
agentbench = "agentbench.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentbench"]
